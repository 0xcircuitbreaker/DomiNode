# Template: C++ SDK publish workflow
# Copy to .github/workflows/publish.yml in dominusnode-cpp
# Creates a GitHub Release with source archive

name: Publish C++ SDK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev nlohmann-json3-dev

      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        run: |
          tar czf dominusnode-cpp-${{ steps.version.outputs.version }}.tar.gz \
            --exclude=build --exclude=.git \
            .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dominusnode-cpp-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: true
