# Template: ChatGPT GPT Actions publish workflow
# Copy to .github/workflows/publish.yml in dominusnode-chatgpt
# Creates a GitHub Release with the OpenAPI spec + plugin manifest

name: Publish ChatGPT GPT Actions

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate OpenAPI spec
        run: npx @redocly/cli lint openapi.yaml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            openapi.yaml
            ai-plugin.json
          generate_release_notes: true
