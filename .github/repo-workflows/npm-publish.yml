# Template: npm package publish workflow
# Copy this to .github/workflows/publish.yml in each npm-based repo
# Works for: dominusnode-node, dominusnode-vercel-ai, dominusnode-openclaw,
#            dominusnode-openai, dominusnode-n8n, dominusnode-gemini,
#            dominusnode-flowise, dominusnode-mastra

name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
