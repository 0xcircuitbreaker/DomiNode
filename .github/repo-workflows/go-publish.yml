# Template: Go module publish workflow
# Copy to .github/workflows/publish.yml in dominusnode-go
# Go modules are auto-indexed by proxy.golang.org when tags are pushed

name: Publish Go Module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Trigger Go proxy indexing
        run: GOPROXY=proxy.golang.org go list -m github.com/Dominus-Node/dominusnode-go@${GITHUB_REF_NAME}
