name: Publish Go SDK

# Go modules are published by tagging on GitHub.
# The Go module proxy (proxy.golang.org) picks it up automatically.
# This workflow verifies the build and triggers proxy indexing.

on:
  push:
    tags:
      - "go-v*"

permissions:
  contents: read

jobs:
  verify-and-index:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22"

      - name: Verify build
        run: go build ./...

      - name: Run vet
        run: go vet ./...

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/go-}" >> "$GITHUB_OUTPUT"

      - name: Trigger Go module proxy indexing
        run: GOPROXY=proxy.golang.org go list -m github.com/dominusnode/dominusnode-go@${{ steps.version.outputs.version }}
        continue-on-error: true
