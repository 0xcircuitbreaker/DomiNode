name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform (build, lint, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dominusnode_test
          POSTGRES_USER: dominusnode
          POSTGRES_PASSWORD: dominusnode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dominusnode"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://dominusnode:dominusnode_test@localhost:5432/dominusnode_test
      JWT_SECRET: test-secret-key-that-is-at-least-32-characters-long-for-testing
      LOG_LEVEL: error
      NODE_ENV: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Env reference is current
        run: npm run docs:env:check
      - name: Tests
        run: npx vitest run
      - name: Frontend tests
        run: npm run test:frontend
      - name: Frontend test type-check
        run: npm run typecheck:test --workspace=packages/frontend
      - name: Frontend build (as the Dockerfile runs it)
        run: npm run build --workspace=packages/frontend
      - name: Extension build
        run: npm run build --workspace=packages/extension
      - name: Extension tests
        run: npm test --workspace=packages/extension

  sdk-node:
    name: SDK (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: sdks/node/package-lock.json
      - run: npm ci
      - run: npm test

  sdk-python:
    name: SDK (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  sdk-go:
    name: SDK (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: sdks/go/go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...

  sdk-rust:
    name: SDK (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@56f84321dbccf38fb67ce29ab63e4754056677e0 # stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo test --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings

  sdk-java:
    name: SDK (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  sdk-cpp:
    name: SDK (C++)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/cpp
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev nlohmann-json3-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  integrations-python:
    name: Integration (Python) ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: agent-zero, tests: tests }
          - { name: agno, tests: tests }
          - { name: autogpt, tests: tests }
          - { name: camel-ai, tests: tests }
          - { name: composio, tests: tests }
          - { name: crewai, tests: tests }
          - { name: dify, tests: tests }
          - { name: gemini, tests: python_tests }
          - { name: haystack, tests: tests }
          - { name: ironclaw, tests: tests }
          - { name: langchain, tests: tests }
          - { name: langflow, tests: tests }
          - { name: llamaindex, tests: tests }
          - { name: metagpt, tests: tests }
          - { name: moltbook, tests: tests }
          - { name: openai-functions, tests: python_tests }
          - { name: pydantic-ai, tests: tests }
          - { name: semantic-kernel, tests: tests }
          - { name: superagi, tests: tests }
          - { name: taskweaver, tests: tests }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install SDK (editable)
        run: pip install -e sdks/python
      - name: Install integration
        run: pip install -e "integrations/${{ matrix.name }}[dev]"
      - name: Tests
        working-directory: integrations/${{ matrix.name }}
        run: python -m pytest -q ${{ matrix.tests }}

  integrations-js:
    name: Integration (JS) ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [chatgpt, flowise, gemini, mastra, n8n, openai-functions, openclaw, pi, vercel-ai]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
      - name: Build and pack SDK
        working-directory: sdks/node
        run: |
          npm ci
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install integration with local SDK tarball
        working-directory: integrations/${{ matrix.name }}
        run: npm install --no-save "$RUNNER_TEMP"/dominusnode-sdk-*.tgz
      - name: Tests
        working-directory: integrations/${{ matrix.name }}
        run: npx vitest run
