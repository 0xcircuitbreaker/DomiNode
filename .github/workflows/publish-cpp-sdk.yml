name: Publish C++ SDK GitHub Release

# C++ has no central package registry.
# This workflow builds, tests, and creates a GitHub Release with source archive.

on:
  push:
    tags:
      - "cpp-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: publish
    defaults:
      run:
        working-directory: sdks/cpp

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev nlohmann-json3-dev

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/cpp-}" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        run: |
          cd ../..
          tar czf dominusnode-cpp-${{ steps.version.outputs.version }}.tar.gz \
            --exclude='sdks/cpp/build' \
            --exclude='sdks/cpp/.git' \
            sdks/cpp/
        working-directory: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dominusnode-cpp-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: true
