name: Publish Java SDK to GitHub Packages

on:
  push:
    tags:
      - "java-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    defaults:
      run:
        working-directory: sdks/java

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Build and test
        run: mvn clean verify

      - name: Deploy to GitHub Packages
        run: mvn deploy -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/Dominus-Node/dominusnode-java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
