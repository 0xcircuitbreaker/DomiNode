# Publishes the exit-node image (BOOTSTRAP_PLAN §7 E4):
#   ghcr.io/0xcircuitbreaker/dominusnode-node:{<tag>,latest}  (linux/amd64, linux/arm64)
# The official network's coordinator pins are PUBLIC keys passed as a build arg from
# the repository variable DN_COORD_PUBKEYS (Settings > Variables). The Dockerfile's
# build fails without them, so an image is never published unpinned.
name: node-image

on:
  push:
    tags: ["node-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: node-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/0xcircuitbreaker/dominusnode-node
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check coordinator pins
        env:
          PINS: ${{ vars.DN_COORD_PUBKEYS }}
        run: |
          printf '%s' "$PINS" | grep -Eq '^[0-9a-f]{64}(,[0-9a-f]{64})*$' \
            || { echo "set repository variable DN_COORD_PUBKEYS (comma-separated 64-hex public keys)"; exit 1; }

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          t="${INPUT_TAG:-${REF_NAME#node-v}}"
          printf '%s' "$t" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$' || { echo "bad tag: $t"; exit 1; }
          echo "tag=$t" >> "$GITHUB_OUTPUT"

      # TODO: pin to a commit SHA like the other actions in this repo.
      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: packages/node-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DN_COORD_PUBKEYS=${{ vars.DN_COORD_PUBKEYS }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=DominusNode exit node agent
