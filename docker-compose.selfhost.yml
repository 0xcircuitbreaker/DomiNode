# One-command self-host (BOOTSTRAP_PLAN §7 E1). Generated config lives in
# ./selfhost/ (written by scripts/selfhost/install.sh); do not edit by hand,
# re-run the installer instead (re-runs upgrade in place).
#
#   ./scripts/selfhost/install.sh
#
# Hostnames are config only: PUBLIC_HOSTNAMES may list several names (for
# example an apex domain and a subdomain of another domain) and every one is
# served with the same API. DOMINUSNODE_DOMAIN is the primary name used in links.
#
# Profiles select what runs on this box (install.sh passes them from ROLE/TLS_MODE):
#   coordinator  postgres, migrate, api, admin UI (ROLE=all|coordinator)
#   gateway      keys, gateway                    (ROLE=all|gateway)
#   caddy        Caddy TLS front end              (unless ROLE=coordinator TLS_MODE=cloudflare)
#   cloudflare   cloudflared + its token copier   (TLS_MODE=cloudflare)
#   proxytls     proxy-certs: Caddy's PROXY_HOST cert -> gateway (unless TLS_MODE=off)
#   dnscf        caddy-dns-keys: Cloudflare DNS token for ACME DNS-01 (ACME_CHALLENGE=dns-cloudflare)
# docker-compose.selfhost.plain.yml publishes plaintext 8080/1080 (TLS_MODE=off,
# or PUBLISH_PLAINTEXT_PROXY=1).
# docker-compose.selfhost.wg-db.yml is added for ROLE=coordinator with DB_WG_BIND
# (Postgres published only on the WireGuard address for a separate gateway).
name: dominusnode

x-common-env: &common-env
  NODE_ENV: production
  DATABASE_URL: postgresql://dominusnode:${POSTGRES_PASSWORD:?run scripts/selfhost/install.sh}@postgres:5432/dominusnode
  DB_SSL: "false"
  JWT_SECRET: ${JWT_SECRET:?run scripts/selfhost/install.sh}
  DOMINUSNODE_DOMAIN: ${DOMINUSNODE_DOMAIN:?run scripts/selfhost/install.sh}

services:
  postgres:
    profiles: [coordinator]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dominusnode
      POSTGRES_USER: dominusnode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/selfhost/install.sh}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dominusnode"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  migrate:
    profiles: [coordinator]
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    image: dominusnode-api:selfhost
    environment: *common-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    command: ["node", "packages/shared/dist/src/migrate.js"]
    restart: "no"

  # Copies host-owned secrets into root-only named volumes owned by the
  # container user (uid 1001, mode 0400). The host files stay 0600 and owned by
  # whoever ran install.sh; re-running fixes the ownership of existing installs.
  keys:
    # Copies the coordinator key for every service that signs: the gateway
    # (node-tunnel CHALLENGEs) and the api (coordinator.json, policy.json).
    profiles: [gateway, coordinator]
    image: dominusnode-api:selfhost
    depends_on:
      migrate: { condition: service_completed_successfully, required: false }
    user: "0:0"
    network_mode: none
    restart: "no"
    volumes:
      - ./selfhost/coord-key.pem:/src/coord-key.pem:ro
      # API key pepper (HMAC key for api_keys.key_hash). The api and every
      # gateway MUST hold the same file; install.sh generates it once.
      - ./selfhost/api-key-pepper:/src/api-key-pepper:ro
      - gateway_secrets:/dst
    command:
      - sh
      - -euc
      - |
        install -o 1001 -g 1001 -m 0400 /src/coord-key.pem /dst/coord-key.pem.tmp
        mv -f /dst/coord-key.pem.tmp /dst/coord-key.pem
        install -o 1001 -g 1001 -m 0400 /src/api-key-pepper /dst/api-key-pepper.tmp
        mv -f /dst/api-key-pepper.tmp /dst/api-key-pepper
        chown 1001:1001 /dst && chmod 0500 /dst

  api:
    profiles: [coordinator]
    image: dominusnode-api:selfhost
    restart: unless-stopped
    environment:
      <<: *common-env
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?run scripts/selfhost/install.sh}
      DASHBOARD_PORT: "3000"
      TRUST_PROXY: "1"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_URL: https://${DOMINUSNODE_DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PROXY_INTERNAL_HOST: ${PROXY_INTERNAL_HOST:-gateway}
      # Public gateway hostnames (ROLE=gateway boxes may live elsewhere).
      PROXY_PUBLIC_HOST: ${PROXY_HOST:-${DOMINUSNODE_DOMAIN}}
      COORD_TUNNEL_URL: wss://${RELAY_HOST:-${DOMINUSNODE_DOMAIN}}:${TUNNEL_HOST_PORT:-8443}/v1/tunnel
      COORD_ADDITIONAL_PUBKEYS: ${COORD_ADDITIONAL_PUBKEYS:-}
      SMTP_FROM: ${OPERATOR_CONTACT:-}
      # Contacts and branding: /.well-known/security.txt and coordinator.json.
      OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
      ABUSE_CONTACT: ${ABUSE_CONTACT:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      SITE_NAME: ${SITE_NAME:-}
      OFFICIAL_COORD_PUBKEYS: ${OFFICIAL_COORD_PUBKEYS:-}
      # Human admin login for the admin UI (DEPLOYMENT.md "Self-host admin").
      ADMIN_HUMAN_LOGIN: ${ADMIN_HUMAN_LOGIN:-false}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      API_KEY_PEPPER_FILE: /run/dominusnode/api-key-pepper
      # Advertised TLS proxy ports (empty with TLS_MODE=off: not advertised).
      PROXY_PUBLIC_TLS_PORT: ${PROXY_PUBLIC_TLS_PORT-8444}
      PROXY_PUBLIC_SOCKS5_TLS_PORT: ${PROXY_PUBLIC_SOCKS5_TLS_PORT-1443}
      # Signs /.well-known/dominusnode/{coordinator,policy}.json (503 without it).
      COORD_SIGNING_KEY_FILE: /run/dominusnode/coord-key.pem
      COORDINATOR_HOSTNAMES: ${PUBLIC_HOSTNAMES:-${DOMINUSNODE_DOMAIN}}
    volumes:
      - gateway_secrets:/run/dominusnode:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      keys: { condition: service_completed_successfully }
    networks: [backend, frontend]
    expose: ["3000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  # Admin UI (React build served by nginx; /api/* is proxied to api:3000).
  # Caddy routes /api, /v1, /.well-known, /status and /llms.txt to the api,
  # only the admin paths (/admin, /login, assets) here, and redirects / to /admin.
  # Self-host nginx config: no HSTS includeSubDomains/preload, connect-src self.
  frontend:
    profiles: [coordinator]
    build: { context: ., dockerfile: infra/docker/frontend.Dockerfile, args: { NGINX_CONF: infra/nginx/selfhost.conf } }
    image: dominusnode-frontend:selfhost
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    networks: [frontend]
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  gateway:
    profiles: [gateway]
    build: { context: ., dockerfile: infra/docker/proxy.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *common-env
      # ROLE=gateway: the coordinator's Postgres over WireGuard (install.sh
      # only accepts a private address). Default: the local postgres service.
      DATABASE_URL: ${GATEWAY_DATABASE_URL:-postgresql://dominusnode:${POSTGRES_PASSWORD:?run scripts/selfhost/install.sh}@postgres:5432/dominusnode}
      PROXY_LISTEN_PORT: "8080"
      SOCKS5_LISTEN_PORT: "1080"
      TUNNEL_PORT: "8443"
      # TLS proxy listeners: HTTPS proxy on 8444, SOCKS5-over-TLS on 1443 (8443
      # is the node tunnel behind Caddy). The certificate is Caddy's cert for
      # PROXY_HOST, copied by proxy-certs and hot-reloaded on renewal.
      # TLS_MODE=off: install.sh empties these and sets PROXY_REQUIRE_TLS=false.
      PROXY_TLS_PORT: ${GATEWAY_PROXY_TLS_PORT-8444}
      SOCKS5_TLS_PORT: ${GATEWAY_SOCKS5_TLS_PORT-1443}
      PROXY_TLS_CERT_FILE: ${GATEWAY_PROXY_TLS_CERT_FILE-/run/dominusnode-tls/proxy.crt}
      PROXY_TLS_KEY_FILE: ${GATEWAY_PROXY_TLS_KEY_FILE-/run/dominusnode-tls/proxy.key}
      # Credentials on plaintext 8080/1080 are refused (production default).
      PROXY_REQUIRE_TLS: ${PROXY_REQUIRE_TLS:-true}
      COORD_SIGNING_KEY_FILE: /run/dominusnode/coord-key.pem
      API_KEY_PEPPER_FILE: /run/dominusnode/api-key-pepper
      ASN_DB_FILE: /app/data/ip2asn-combined.tsv.gz
      # Caddy terminates TLS for the node tunnel and forwards the node's real
      # address in a PROXY v2 header; only Caddy's fixed address may send one.
      TUNNEL_TRUSTED_PROXY_IPS: 172.29.53.2
    volumes:
      - gateway_secrets:/run/dominusnode:ro
      - proxy_tls:/run/dominusnode-tls:ro
      - ./data:/app/data:ro
    depends_on:
      migrate: { condition: service_completed_successfully, required: false }
      keys: { condition: service_completed_successfully }
      proxy-certs: { condition: service_healthy, required: false }
    networks: [backend, frontend]
    ports:
      - "${PROXY_TLS_HOST_PORT:-8444}:8444"
      - "${SOCKS5_TLS_HOST_PORT:-1443}:1443"
    # Plaintext 8080/1080 are published only by docker-compose.selfhost.plain.yml.
    # The tunnel port (8443) is NOT published here: nodes reach it through Caddy.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  caddy:
    profiles: [caddy]
    # caddy:2.11.9-alpine + caddy-dns/cloudflare, pinned in infra/docker/caddy.Dockerfile.
    build:
      context: .
      dockerfile: infra/docker/caddy.Dockerfile
    image: dominusnode-caddy:selfhost
    restart: unless-stopped
    depends_on:
      api: { condition: service_started, required: false }
      caddy-dns-keys: { condition: service_completed_successfully, required: false }
    # No dependency on gateway: gateway waits (service_healthy) on proxy-certs,
    # which waits for the cert only a running Caddy can obtain. reverse_proxy
    # tolerates an upstream that is not up yet.
    ports:
      - "${HTTP_HOST_PORT:-80}:80"
      - "${HTTPS_HOST_PORT:-443}:443"
      - "${TUNNEL_HOST_PORT:-8443}:8443"
    volumes:
      - ./selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # ACME_CHALLENGE=dns-cloudflare: the Caddyfile reads the DNS token with
      # {file./run/caddy-secrets/cloudflare-dns.token}; empty volume otherwise.
      - caddy_secrets:/run/caddy-secrets:ro
    networks:
      frontend:
        ipv4_address: 172.29.53.2

  # Copies Caddy's certificate for PROXY_HOST (any issuer: Let's Encrypt,
  # ZeroSSL fallback or `tls internal`) from Caddy's storage into a volume the
  # gateway (uid 1001) can read, mode 0400. Polls every 5 minutes; the gateway
  # re-reads the files every minute and swaps the cert in place (no restart).
  # Healthy once a cert exists, so the gateway starts only with a cert.
  proxy-certs:
    profiles: [proxytls]
    image: dominusnode-api:selfhost
    restart: unless-stopped
    user: "0:0"
    network_mode: none
    environment:
      CERT_HOST: ${PROXY_HOST:-${DOMINUSNODE_DOMAIN}}
    volumes:
      - caddy_data:/caddy:ro
      - proxy_tls:/dst
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    command:
      - sh
      - -euc
      - |
        chown 1001:1001 /dst && chmod 0500 /dst
        while :; do
          c="$$(find /caddy/caddy/certificates -type f -path "*/$$CERT_HOST/$$CERT_HOST.crt" 2>/dev/null | xargs -r ls -t | head -n1)"
          k="$${c%.crt}.key"
          if [ -n "$$c" ] && [ -s "$$c" ] && [ -s "$$k" ]; then
            if ! cmp -s "$$c" /dst/proxy.crt || ! cmp -s "$$k" /dst/proxy.key; then
              install -o 1001 -g 1001 -m 0400 "$$k" /dst/proxy.key.tmp
              install -o 1001 -g 1001 -m 0400 "$$c" /dst/proxy.crt.tmp
              mv -f /dst/proxy.key.tmp /dst/proxy.key
              mv -f /dst/proxy.crt.tmp /dst/proxy.crt
              echo "proxy-certs: updated certificate for $$CERT_HOST from $$c"
            fi
          else
            echo "proxy-certs: waiting for Caddy to obtain a certificate for $$CERT_HOST"
          fi
          sleep "$$( [ -s /dst/proxy.crt ] && echo 300 || echo 10 )"
        done
    healthcheck:
      test: ["CMD-SHELL", "test -s /dst/proxy.crt && test -s /dst/proxy.key"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s

  # TLS_MODE=cloudflare: copies the 0600 tunnel token file into a volume owned
  # by cloudflared's uid (65532, mode 0400). The token never enters .env, the
  # compose environment or any command line.
  cloudflared-keys:
    profiles: [cloudflare]
    image: dominusnode-api:selfhost
    user: "0:0"
    network_mode: none
    restart: "no"
    volumes:
      - ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-./selfhost/cloudflared.token}:/src/token:ro
      - cloudflared_secrets:/dst
    command:
      - sh
      - -euc
      - |
        install -o 65532 -g 65532 -m 0400 /src/token /dst/token.tmp
        mv -f /dst/token.tmp /dst/token
        chown 65532:65532 /dst && chmod 0500 /dst

  # ACME_CHALLENGE=dns-cloudflare: copies the 0600 Cloudflare DNS API token file
  # (Zone:DNS:Edit + Zone:Zone:Read, one zone) into a volume only Caddy (root
  # in its image) mounts, mode 0400. Distinct from the tunnel token. The token
  # never enters .env, the compose environment, any command line or the Caddyfile.
  caddy-dns-keys:
    profiles: [dnscf]
    image: dominusnode-api:selfhost
    user: "0:0"
    network_mode: none
    restart: "no"
    volumes:
      - ${CLOUDFLARE_DNS_TOKEN_FILE:-./selfhost/cloudflare-dns.token}:/src/token:ro
      - caddy_secrets:/dst
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    command:
      - sh
      - -euc
      - |
        install -o 0 -g 0 -m 0400 /src/token /dst/cloudflare-dns.token.tmp
        mv -f /dst/cloudflare-dns.token.tmp /dst/cloudflare-dns.token
        chown 0:0 /dst && chmod 0500 /dst

  # Outbound-only Cloudflare Tunnel: no inbound ports. Public hostnames are
  # mapped in the Cloudflare dashboard: /api, /v1 and the other API paths to
  # http://api:3000 (keeps per-client IPs), admin paths to http://frontend:8080
  # (DEPLOYMENT.md "Self-host admin").
  cloudflared:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    user: "65532:65532"
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/cloudflared/token"]
    volumes:
      - cloudflared_secrets:/run/cloudflared:ro
    depends_on:
      cloudflared-keys: { condition: service_completed_successfully }
      api: { condition: service_started, required: false }
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true

  # No in-stack exit node: a node on this box reaches the gateway from a
  # private address and is refused as a private peer. Run nodes on other hosts
  # (DEPLOYMENT.md §7 and the join command install.sh prints).

networks:
  backend:
    internal: true
  frontend:
    ipam:
      config:
        - subnet: 172.29.53.0/24
          # Dynamic addresses come from the upper half only, so Caddy's fixed
          # 172.29.53.2 (trusted by the gateway for PROXY v2) can never be taken.
          ip_range: 172.29.53.128/25

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_secrets:
  gateway_secrets:
  proxy_tls:
  cloudflared_secrets:
