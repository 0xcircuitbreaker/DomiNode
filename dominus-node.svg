<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="saasPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="saasAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="saasHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <filter id="saasGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <style>
      .saas-primary {
        fill: url(#saasPrimary);
        filter: url(#saasGlow);
      }
      
      .saas-accent {
        fill: url(#saasAccent);
        filter: url(#saasGlow);
      }
      
      .saas-highlight {
        fill: url(#saasHighlight);
      }
      
      .saas-line {
        stroke: url(#saasAccent);
        stroke-width: 2;
        fill: none;
        opacity: 0.8;
      }
    </style>
  </defs>
  
  <!-- Background removed for transparency -->
  
  <g transform="translate(100, 100)">
    <!-- Glow rings -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#saasPrimary)" stroke-width="1" opacity="0.2" filter="url(#saasGlow)"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="url(#saasAccent)" stroke-width="1" opacity="0.15" filter="url(#saasGlow)"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-30" y2="-65" class="saas-line"/>
    <line x1="0" y1="0" x2="30" y2="-65" class="saas-line"/>
    <line x1="0" y1="0" x2="65" y2="-30" class="saas-line"/>
    <line x1="0" y1="0" x2="65" y2="30" class="saas-line"/>
    <line x1="0" y1="0" x2="30" y2="65" class="saas-line"/>
    <line x1="0" y1="0" x2="-30" y2="65" class="saas-line"/>
    <line x1="0" y1="0" x2="-65" y2="30" class="saas-line"/>
    <line x1="0" y1="0" x2="-65" y2="-30" class="saas-line"/>
    
    <!-- Satellite nodes -->
    <g>
      <circle cx="-30" cy="-65" r="8" class="saas-accent"/>
      <circle cx="-30" cy="-65" r="4" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="30" cy="-65" r="8" class="saas-accent"/>
      <circle cx="30" cy="-65" r="4" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="65" cy="-30" r="8" class="saas-accent"/>
      <circle cx="65" cy="-30" r="4" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="65" cy="30" r="8" class="saas-accent"/>
      <circle cx="65" cy="30" r="4" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="30" cy="65" r="8" class="saas-accent"/>
      <circle cx="30" cy="65" r="4" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="-30" cy="65" r="8" class="saas-accent"/>
      <circle cx="-30" cy="65" r="4" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="-65" cy="30" r="8" class="saas-accent"/>
      <circle cx="-65" cy="30" r="4" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="1.5"/>
    </g>
    <g>
      <circle cx="-65" cy="-30" r="8" class="saas-accent"/>
      <circle cx="-65" cy="-30" r="4" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="1.5"/>
    </g>
    
    <!-- Central hexagon -->
    <path d="M 0 -45 L 40 -22 L 40 22 L 0 45 L -40 22 L -40 -22 Z" 
          class="saas-primary" 
          stroke="url(#saasAccent)" 
          stroke-width="3"/>
    
    <!-- Inner detail hexagon -->
    <path d="M 0 -35 L 30 -17 L 30 17 L 0 35 L -30 17 L -30 -17 Z" 
          fill="none" 
          stroke="url(#saasHighlight)" 
          stroke-width="1.5"
          opacity="0.5"/>
    
    <!-- Core -->
    <circle cx="0" cy="0" r="18" class="saas-accent"/>
    <circle cx="0" cy="0" r="12" class="saas-highlight" opacity="0.9"/>
    <circle cx="0" cy="0" r="6" fill="#0f172a" stroke="url(#saasAccent)" stroke-width="2"/>
  </g>
</svg>
