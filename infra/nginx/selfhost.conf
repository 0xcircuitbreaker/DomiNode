# Self-host admin UI (scripts/selfhost): plain HSTS on this host only (the
# operator decides about subdomains and preload lists), connect-src only self.
#
# This is the site router for a self-host: Caddy (TLS_MODE auto/internal/off)
# and the Cloudflare tunnel (TLS_MODE=cloudflare) both send every non-API path
# here, and the tunnel sends everything (its public hostnames point at
# http://frontend:8080). API paths go on to api:3000; /admin and the auth pages
# are the admin UI; the public site (landing, pricing, terms...) is served only
# with DN_PUBLIC_SITE=1 (installer PUBLIC_SITE), else / redirects to /admin.
#
# Rendered by the nginx image's envsubst step (only the DN_PUBLIC_SITE variable).
# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    root /usr/share/nginx/html;
    index index.html;

    set $dn_public_site "${DN_PUBLIC_SITE}";

    # Client address: this port is reachable only from the compose "frontend"
    # network (never published), where the peers are Caddy and cloudflared,
    # so their X-Forwarded-For is trusted. The api trusts one hop
    # (TRUST_PROXY=1): the header sent on is replaced with the single address.
    set_real_ip_from 172.29.53.0/24;
    set_real_ip_from fd29:53:0:1::/64;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Both front ends terminate TLS before this hop.
    set $dn_proto https;
    if ($http_x_forwarded_proto = "http") { set $dn_proto http; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-src https://www.google.com/recaptcha/; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests;" always;

    # ──         limit_req zone=api burst=50 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $dn_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
 paths -> api:3000 ──
    location ^~ /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $dn_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
    location ^~ /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $dn_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
    location ^~ /v1 {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $dn_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
    location ^~ /.well-known/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $dn_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
    location ^~ /status {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $dn_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
    location = /llms.txt {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $dn_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
    location = /health {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $dn_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ── Static assets ── (must repeat ALL security headers: add_header inheritance)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-src https://www.google.com/recaptcha/; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests;" always;
        try_files $uri =404;
    }
    location ^~ /docs/ {
        try_files $uri =404;
    }

    # ── Admin UI (always) ──
    location ^~ /admin {
        try_files /index.html =404;
    }
    location ~ ^/(login|forgot-password|reset-password|verify-email)$ {
        try_files /index.html =404;
    }

    # ── Public site (DN_PUBLIC_SITE=1), else / -> /admin and 404 ──
    location = / {
        if ($dn_public_site != "1") { return 302 /admin; }
        try_files /index.html =404;
    }
    location / {
        if ($dn_public_site != "1") { return 404; }
        try_files $uri $uri/ /index.html;
    }
}
