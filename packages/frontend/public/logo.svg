<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="saasPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="saasAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="saasHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <!-- Lighter glow filter for better small-size rendering -->
    <filter id="saasGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <style>
      .saas-primary {
        fill: url(#saasPrimary);
        filter: url(#saasGlow);
      }
      
      .saas-accent {
        fill: url(#saasAccent);
        filter: url(#saasGlow);
      }
      
      .saas-highlight {
        fill: url(#saasHighlight);
      }
      
      .saas-line {
        stroke: url(#saasAccent);
        stroke-width: 3;
        fill: none;
        opacity: 0.9;
        stroke-linecap: round;
      }
    </style>
  </defs>
  
  <!-- Sharp rendering for small sizes -->
  <g shape-rendering="geometricPrecision">
    <g transform="translate(100, 100)">
      <!-- Glow rings - slightly more visible -->
      <circle cx="0" cy="0" r="80" fill="none" stroke="url(#saasPrimary)" stroke-width="1.5" opacity="0.3" filter="url(#saasGlow)"/>
      <circle cx="0" cy="0" r="65" fill="none" stroke="url(#saasAccent)" stroke-width="1.5" opacity="0.25" filter="url(#saasGlow)"/>
      
      <!-- Connection lines - thicker -->
      <line x1="0" y1="0" x2="-30" y2="-65" class="saas-line"/>
      <line x1="0" y1="0" x2="30" y2="-65" class="saas-line"/>
      <line x1="0" y1="0" x2="65" y2="-30" class="saas-line"/>
      <line x1="0" y1="0" x2="65" y2="30" class="saas-line"/>
      <line x1="0" y1="0" x2="30" y2="65" class="saas-line"/>
      <line x1="0" y1="0" x2="-30" y2="65" class="saas-line"/>
      <line x1="0" y1="0" x2="-65" y2="30" class="saas-line"/>
      <line x1="0" y1="0" x2="-65" y2="-30" class="saas-line"/>
      
      <!-- Satellite nodes - all 8 kept, slightly larger -->
      <g>
        <circle cx="-30" cy="-65" r="10" class="saas-accent"/>
        <circle cx="-30" cy="-65" r="5" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="2"/>
      </g>
      <g>
        <circle cx="30" cy="-65" r="10" class="saas-accent"/>
        <circle cx="30" cy="-65" r="5" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="2"/>
      </g>
      <g>
        <circle cx="65" cy="-30" r="10" class="saas-accent"/>
        <circle cx="65" cy="-30" r="5" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="2"/>
      </g>
      <g>
        <circle cx="65" cy="30" r="10" class="saas-accent"/>
        <circle cx="65" cy="30" r="5" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="2"/>
      </g>
      <g>
        <circle cx="30" cy="65" r="10" class="saas-accent"/>
        <circle cx="30" cy="65" r="5" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="2"/>
      </g>
      <g>
        <circle cx="-30" cy="65" r="10" class="saas-accent"/>
        <circle cx="-30" cy="65" r="5" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="2"/>
      </g>
      <g>
        <circle cx="-65" cy="30" r="10" class="saas-accent"/>
        <circle cx="-65" cy="30" r="5" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="2"/>
      </g>
      <g>
        <circle cx="-65" cy="-30" r="10" class="saas-accent"/>
        <circle cx="-65" cy="-30" r="5" fill="#0f172a" stroke="url(#saasHighlight)" stroke-width="2"/>
      </g>
      
      <!-- Central hexagon - thicker stroke -->
      <path d="M 0 -45 L 40 -22 L 40 22 L 0 45 L -40 22 L -40 -22 Z" 
            class="saas-primary" 
            stroke="url(#saasAccent)" 
            stroke-width="4"/>
      
      <!-- Inner detail hexagon - kept, more visible -->
      <path d="M 0 -35 L 30 -17 L 30 17 L 0 35 L -30 17 L -30 -17 Z" 
            fill="none" 
            stroke="url(#saasHighlight)" 
            stroke-width="2"
            opacity="0.6"/>
      
      <!-- Core - all layers kept -->
      <circle cx="0" cy="0" r="20" class="saas-accent"/>
      <circle cx="0" cy="0" r="13" class="saas-highlight" opacity="0.95"/>
      <circle cx="0" cy="0" r="7" fill="#0f172a" stroke="url(#saasAccent)" stroke-width="2.5"/>
    </g>
  </g>
</svg>
