[build]
  # Monorepo: only build the Vite/React frontend workspace.
  command = "npm ci --ignore-scripts --workspace=packages/frontend && npm run build --workspace=packages/frontend"
  publish = "packages/frontend/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_RECAPTCHA_SITE_KEY = "6LcQvXAsAAAAAKtirq965QN3_Ew9x2Hl5THmRUSN"

# Security response headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.dominusnode.daedalusdevelopmentgroup.com; img-src 'self' data:; font-src 'self'; frame-src https://checkout.stripe.com https://nowpayments.io https://www.google.com/recaptcha/; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests;"

# Reverse-proxy API calls to backend so cookie-based auth stays first-party.
[[redirects]]
  from = "/api/*"
  to = "https://api.dominusnode.daedalusdevelopmentgroup.com/api/:splat"
  status = 200
  force = true

# SPA routing support (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
