services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dominusnode}
      POSTGRES_USER: ${POSTGRES_USER:-dominusnode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports exposed — only internal Docker services reach postgres via hostname
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dominusnode}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dominusnode}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dominusnode}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      DASHBOARD_PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-https://dominusnode.com/wallet?topup=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-https://dominusnode.com/wallet?topup=cancel}
      STRIPE_PAYMENT_METHODS: ${STRIPE_PAYMENT_METHODS:-card,link}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-https://dominusnode.com/wallet?topup=success&provider=paypal}
      PAYPAL_CANCEL_URL: ${PAYPAL_CANCEL_URL:-https://dominusnode.com/wallet?topup=cancel&provider=paypal}
      PROXY_INTERNAL_HOST: ${PROXY_INTERNAL_HOST:-proxy}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@dominusnode.com}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_IGNORE_TLS: ${SMTP_IGNORE_TLS:-false}
      APP_URL: ${APP_URL:-http://localhost:5173}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      MAX_REGISTERED_USERS: ${MAX_REGISTERED_USERS:-0}
      MCP_AGENT_SECRET: ${MCP_AGENT_SECRET:-}
      AGENT_RATE_LIMIT_MULTIPLIER: ${AGENT_RATE_LIMIT_MULTIPLIER:-10}
      DOMINUSNODE_DOMAIN: ${DOMINUSNODE_DOMAIN:-dominusnode.com}
      # x402 Protocol
      X402_ENABLED: ${X402_ENABLED:-false}
      X402_NETWORK: ${X402_NETWORK:-base-sepolia}
      X402_RECEIVING_ADDRESS: ${X402_RECEIVING_ADDRESS:-}
      X402_RECEIVING_ADDRESS_SOLANA: ${X402_RECEIVING_ADDRESS_SOLANA:-}
      X402_DC_PRICE_PER_REQUEST_USD: ${X402_DC_PRICE_PER_REQUEST_USD:-0.001}
      X402_RES_PRICE_PER_REQUEST_USD: ${X402_RES_PRICE_PER_REQUEST_USD:-0.005}
      CDP_API_KEY_ID: ${CDP_API_KEY_ID:-}
      CDP_API_KEY_SECRET: ${CDP_API_KEY_SECRET:-}
      PAYAI_API_KEY_ID: ${PAYAI_API_KEY_ID:-}
      PAYAI_API_KEY_SECRET: ${PAYAI_API_KEY_SECRET:-}
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # API port NOT exposed to host — only reachable via nginx on the frontend network
    # Use 'docker exec' or SSH tunnel for direct API access if needed
    expose:
      - "3000"
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  proxy:
    build:
      context: .
      dockerfile: infra/docker/proxy.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dominusnode}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dominusnode}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PROXY_LISTEN_PORT: "8080"
      SOCKS5_LISTEN_PORT: "1080"
      WEBSHARE_DC_USERNAME: ${WEBSHARE_DC_USERNAME:-}
      WEBSHARE_DC_PASSWORD: ${WEBSHARE_DC_PASSWORD:-}
      WEBSHARE_RES_USERNAME: ${WEBSHARE_RES_USERNAME:-}
      WEBSHARE_RES_PASSWORD: ${WEBSHARE_RES_PASSWORD:-}
      WEBSHARE_PROXY_HOST: ${WEBSHARE_PROXY_HOST:-p.webshare.io}
      WEBSHARE_HTTP_PORT: ${WEBSHARE_HTTP_PORT:-80}
      WEBSHARE_SOCKS5_PORT: ${WEBSHARE_SOCKS5_PORT:-1080}
      WEBSHARE_API_KEY: ${WEBSHARE_API_KEY:-}
      SKIP_GEOIP: ${SKIP_GEOIP:-0}
      AGENT_RATE_LIMIT_MULTIPLIER: ${AGENT_RATE_LIMIT_MULTIPLIER:-10}
      NODE_ENV: production
    # IMPORTANT: In production, use a firewall (ufw/iptables/security group) to restrict
    # access to proxy ports. To bind to localhost only, set PROXY_HTTP_HOST_PORT=127.0.0.1:8080
    # and PROXY_SOCKS5_HOST_PORT=127.0.0.1:1080 in your .env file.
    ports:
      - "${PROXY_HTTP_HOST_PORT:-127.0.0.1:8080}:8080"
      - "${PROXY_SOCKS5_HOST_PORT:-127.0.0.1:1080}:1080"
    networks:
      - proxy
      - backend  # Needs DB access for auth, balance checks, session recording
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/internal/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_HOST_PORT:-127.0.0.1:80}:8080"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

networks:
  frontend:
  backend:
  proxy:

volumes:
  pgdata:
  backups:
