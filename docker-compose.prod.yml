services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dominusnode}
      POSTGRES_USER: ${POSTGRES_USER:-dominusnode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports exposed — only internal Docker services reach postgres via hostname
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dominusnode}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dominusnode}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dominusnode}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      DASHBOARD_PORT: "3000"
      # Advertise the TLS proxy in agent-tool.json, llms.txt and /api/proxy/config (8080/1080 are loopback-only here).
      PROXY_PUBLIC_TLS_PORT: "${PROXY_TLS_HOST_PORT:-8443}"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://dominusnode.com,https://www.dominusnode.com,https://dominusnode.daedalusdevelopmentgroup.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-https://dominusnode.com/wallet?topup=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-https://dominusnode.com/wallet?topup=cancel}
      STRIPE_PAYMENT_METHODS: ${STRIPE_PAYMENT_METHODS:-card,link}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-https://dominusnode.com/wallet?topup=success&provider=paypal}
      PAYPAL_CANCEL_URL: ${PAYPAL_CANCEL_URL:-https://dominusnode.com/wallet?topup=cancel&provider=paypal}
      PROXY_INTERNAL_HOST: ${PROXY_INTERNAL_HOST:-proxy}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@${DOMINUSNODE_DOMAIN:-dominusnode.com}}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_IGNORE_TLS: ${SMTP_IGNORE_TLS:-false}
      APP_URL: ${APP_URL:-https://dominusnode.com}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      MAX_REGISTERED_USERS: ${MAX_REGISTERED_USERS:-0}
      ADMIN_HUMAN_LOGIN: ${ADMIN_HUMAN_LOGIN:-false}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      MCP_AGENT_SECRET: ${MCP_AGENT_SECRET:-}
      AGENT_RATE_LIMIT_MULTIPLIER: ${AGENT_RATE_LIMIT_MULTIPLIER:-10}
      DOMINUSNODE_DOMAIN: ${DOMINUSNODE_DOMAIN:-dominusnode.com}
      COORDINATOR_HOSTNAMES: ${COORDINATOR_HOSTNAMES:-dominusnode.com,dominusnode.daedalusdevelopmentgroup.com}
      # x402 Protocol
      X402_ENABLED: ${X402_ENABLED:-false}
      X402_NETWORK: ${X402_NETWORK:-base-sepolia}
      X402_RECEIVING_ADDRESS: ${X402_RECEIVING_ADDRESS:-}
      X402_RECEIVING_ADDRESS_SOLANA: ${X402_RECEIVING_ADDRESS_SOLANA:-}
      X402_DC_PRICE_PER_REQUEST_USD: ${X402_DC_PRICE_PER_REQUEST_USD:-0.001}
      X402_RES_PRICE_PER_REQUEST_USD: ${X402_RES_PRICE_PER_REQUEST_USD:-0.005}
      CDP_API_KEY_ID: ${CDP_API_KEY_ID:-}
      CDP_API_KEY_SECRET: ${CDP_API_KEY_SECRET:-}
      PAYAI_API_KEY_ID: ${PAYAI_API_KEY_ID:-}
      PAYAI_API_KEY_SECRET: ${PAYAI_API_KEY_SECRET:-}
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # API port NOT exposed to host — only reachable via nginx on the frontend network
    # Use 'docker exec' or SSH tunnel for direct API access if needed
    expose:
      - "3000"
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - ./data:/app/data:ro
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  proxy:
    build:
      context: .
      dockerfile: infra/docker/proxy.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dominusnode}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dominusnode}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Listener ports (getProxyPorts); the gateway refuses to start if two are equal.
      PROXY_LISTEN_PORT: "8080"     # plaintext HTTP proxy
      SOCKS5_LISTEN_PORT: "1080"    # plaintext SOCKS5
      PROXY_TLS_PORT: "8443"        # HTTPS proxy: clients send credentials over TLS
      TUNNEL_PORT: "9443"           # node tunnel (wss), gateway-terminated TLS
      # Certificates: mount a directory with proxy.{crt,key} and tunnel.{crt,key}
      # (one cert with SANs for proxy. and relay. may be copied to both names).
      PROXY_TLS_CERT_FILE: /app/certs/proxy.crt
      PROXY_TLS_KEY_FILE: /app/certs/proxy.key
      TUNNEL_TLS_CERT_FILE: /app/certs/tunnel.crt
      TUNNEL_TLS_KEY_FILE: /app/certs/tunnel.key
      # Coordinator signing key (npm run gen:coord-key); required in production.
      COORD_SIGNING_KEY_FILE: /run/secrets/coord_signing_key
      # Offline ip2asn country+ASN DB (scripts/update-asn-db.sh). Missing = all public traffic refused.
      ASN_DB_FILE: /app/data/ip2asn-combined.tsv.gz
      AGENT_RATE_LIMIT_MULTIPLIER: ${AGENT_RATE_LIMIT_MULTIPLIER:-10}
      NODE_ENV: production
    secrets:
      - coord_signing_key
    volumes:
      - ./data:/app/data:ro
      - ${PROXY_TLS_DIR:-./certs}:/app/certs:ro
    # IMPORTANT: In production, use a firewall (ufw/iptables/security group) to restrict
    # access to proxy ports. The plaintext listeners default to localhost; clients
    # should use the TLS proxy on 8443. Override with PROXY_HTTP_HOST_PORT etc. in .env.
    ports:
      - "${PROXY_HTTP_HOST_PORT:-127.0.0.1:8080}:8080"
      - "${PROXY_SOCKS5_HOST_PORT:-127.0.0.1:1080}:1080"
      - "${PROXY_TLS_HOST_PORT:-8443}:8443"
      - "${TUNNEL_HOST_PORT:-9443}:9443"
    networks:
      - proxy
      - backend  # Needs DB access for auth, balance checks, session recording
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/internal/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_HOST_PORT:-127.0.0.1:80}:8080"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

networks:
  frontend:
  backend:
  proxy:

secrets:
  # PEM written by `npm run gen:coord-key` (mode 0600, readable by the container user).
  coord_signing_key:
    file: ${COORD_SIGNING_KEY_PATH:-./secrets/coord-signing-key.pem}

volumes:
  pgdata:
  backups:
