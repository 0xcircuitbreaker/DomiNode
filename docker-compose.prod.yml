# Container log rotation: Docker's json-file driver never rotates by default.
# The gateway logs at least one line per relayed request; cap each container
# at 5 x 20 MB so logs cannot fill the disk Postgres shares.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Payment rails (DEPLOYMENT.md "Payment rails"). Containers get env only from
# these maps (.env is excluded from images): every rail variable must reach
# the service that reads it. compose-rails.test.ts enforces this.
x-rail-env: &rail-env
  X402_ENABLED: ${X402_ENABLED:-false}
  X402_NETWORK: ${X402_NETWORK:-base-sepolia}
  X402_RECEIVING_ADDRESS: ${X402_RECEIVING_ADDRESS:-}
  X402_RECEIVING_ADDRESS_SOLANA: ${X402_RECEIVING_ADDRESS_SOLANA:-}
  X402_FACILITATOR: ${X402_FACILITATOR:-}
  X402_BYTES_PER_REQUEST: ${X402_BYTES_PER_REQUEST:-10485760}
  X402_MAX_REQUEST_BODY_BYTES: ${X402_MAX_REQUEST_BODY_BYTES:-10485760}
  X402_MAX_RESPONSE_BYTES: ${X402_MAX_RESPONSE_BYTES:-10485760}
  X402_DC_PRICE_PER_REQUEST_USD: ${X402_DC_PRICE_PER_REQUEST_USD:-0.001}
  X402_RES_PRICE_PER_REQUEST_USD: ${X402_RES_PRICE_PER_REQUEST_USD:-0.005}
  CDP_API_KEY_ID: ${CDP_API_KEY_ID:-}
  CDP_API_KEY_SECRET: ${CDP_API_KEY_SECRET:-}
  PAYAI_API_KEY_ID: ${PAYAI_API_KEY_ID:-}
  PAYAI_API_KEY_SECRET: ${PAYAI_API_KEY_SECRET:-}
  MPP_CHALLENGE_SECRET: ${MPP_CHALLENGE_SECRET:-}
  MPP_PAY_TO: ${MPP_PAY_TO:-}
  MPP_CURRENCY: ${MPP_CURRENCY:-}
  MPP_CHAIN_ID: ${MPP_CHAIN_ID:-}
  MPP_RPC_URL: ${MPP_RPC_URL:-}
  MPP_REALM: ${MPP_REALM:-dominusnode-proxy}
  PAYOUTS_ENABLED: ${PAYOUTS_ENABLED:-false}
  PAYOUT_SDN_FILE: ${PAYOUT_SDN_FILE:-}
  PAYOUT_ALLOW_TESTNET: ${PAYOUT_ALLOW_TESTNET:-}
  STARTER_CREDIT_RPC_URL: ${STARTER_CREDIT_RPC_URL:-}
  STARTER_CREDIT_RPC_TIMEOUT_MS: ${STARTER_CREDIT_RPC_TIMEOUT_MS:-3000}

x-rail-gateway-env: &rail-gateway-env
  # Per-request rails are verified and settled in the gateway process.
  X402_RELAY_ENABLED: ${X402_RELAY_ENABLED:-true}
  X402_MAX_OVERPAY_FACTOR: ${X402_MAX_OVERPAY_FACTOR:-100}
  X402_RATE_LIMIT_MAX: ${X402_RATE_LIMIT_MAX:-60}
  PAYER_SDN_FILE: ${PAYER_SDN_FILE:-}
  PAYER_SDN_REQUIRED: ${PAYER_SDN_REQUIRED:-}
  # Payout job (PAYOUTS_ENABLED=true): the signer key is a file under ./data
  # (mounted read-only at /app/data), never an env value.
  PAYOUT_RPC_URL: ${PAYOUT_RPC_URL:-}
  PAYOUT_SIGNER_KEY_FILE: ${PAYOUT_SIGNER_KEY_FILE:-/app/data/payout-signer-key}
  PAYOUT_RUN_CAP_USD: ${PAYOUT_RUN_CAP_USD:-10000}
  PAYOUT_JOB_INTERVAL_MS: ${PAYOUT_JOB_INTERVAL_MS:-86400000}

x-rail-api-env: &rail-api-env
  # Wallet top-up rails (NOWPayments crypto, Tempo) and what /v1/pricing advertises.
  NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
  NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
  NOWPAYMENTS_API_URL: ${NOWPAYMENTS_API_URL:-https://api.nowpayments.io/v1}
  NOWPAYMENTS_WEBHOOK_IPS: ${NOWPAYMENTS_WEBHOOK_IPS:-}
  TEMPO_WEBHOOK_SECRET: ${TEMPO_WEBHOOK_SECRET:-}
  TEMPO_PAY_TO: ${TEMPO_PAY_TO:-}
  TEMPO_TOKEN: ${TEMPO_TOKEN:-}
  TEMPO_CHAIN_ID: ${TEMPO_CHAIN_ID:-}
  NETWORK_PAYMENT_RAILS: ${NETWORK_PAYMENT_RAILS:-wallet,x402,mpp,tempo,crypto}
  # 0 = no signup cap (the code default without this is 2500).
  MAX_REGISTERED_USERS: ${MAX_REGISTERED_USERS:-0}
  # Operator alerting (DEPLOYMENT.md "Ops alerts"); off until OPS_ALERT_WEBHOOKS is set.
  OPS_ALERT_WEBHOOKS: ${OPS_ALERT_WEBHOOKS:-}
  OPS_ALERT_INTERVAL_SEC: ${OPS_ALERT_INTERVAL_SEC:-60}
  OPS_ALERT_GATEWAY_STALE_SEC: ${OPS_ALERT_GATEWAY_STALE_SEC:-180}
  OPS_ALERT_MIN_LIVE_NODES: ${OPS_ALERT_MIN_LIVE_NODES:-0}
  OPS_ALERT_NODE_DROP_PCT: ${OPS_ALERT_NODE_DROP_PCT:-50}
  OPS_ALERT_PAYMENT_FAILURES: ${OPS_ALERT_PAYMENT_FAILURES:-3}
  OPS_ALERT_V1_ERROR_PCT: ${OPS_ALERT_V1_ERROR_PCT:-20}
  OPS_ALERT_V1_MIN_REQUESTS: ${OPS_ALERT_V1_MIN_REQUESTS:-50}
  OPS_ALERT_DEBIT_SPIKE_CENTS: ${OPS_ALERT_DEBIT_SPIKE_CENTS:-5000}
  OPS_ALERT_DEBIT_SPIKE_FACTOR: ${OPS_ALERT_DEBIT_SPIKE_FACTOR:-5}
  OPS_ALERT_DEDUPE_SEC: ${OPS_ALERT_DEDUPE_SEC:-1800}
  OPS_ALERT_MAX_PER_HOUR: ${OPS_ALERT_MAX_PER_HOUR:-30}

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dominusnode}
      POSTGRES_USER: ${POSTGRES_USER:-dominusnode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports exposed — only internal Docker services reach postgres via hostname
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dominusnode}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  api:
    logging: *default-logging
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*rail-env, *rail-api-env]
      DATABASE_URL: postgresql://${POSTGRES_USER:-dominusnode}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dominusnode}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      DASHBOARD_PORT: "3000"
      # Advertise the TLS proxy in agent-tool.json, llms.txt and /api/proxy/config (8080/1080 are loopback-only here).
      PROXY_PUBLIC_TLS_PORT: "${PROXY_TLS_HOST_PORT:-8443}"
      PROXY_PUBLIC_SOCKS5_TLS_PORT: "${SOCKS5_TLS_HOST_PORT:-1443}"
      # 8080/1080 are loopback-only: keep them out of coordinator.json.
      PROXY_PUBLISH_PLAINTEXT: ${PROXY_PUBLISH_PLAINTEXT:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://dominusnode.com,https://www.dominusnode.com,https://dominusnode.daedalusdevelopmentgroup.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-https://dominusnode.com/wallet?topup=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-https://dominusnode.com/wallet?topup=cancel}
      STRIPE_PAYMENT_METHODS: ${STRIPE_PAYMENT_METHODS:-card,link}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-https://dominusnode.com/wallet?topup=success&provider=paypal}
      PAYPAL_CANCEL_URL: ${PAYPAL_CANCEL_URL:-https://dominusnode.com/wallet?topup=cancel&provider=paypal}
      PROXY_INTERNAL_HOST: ${PROXY_INTERNAL_HOST:-proxy}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@${DOMINUSNODE_DOMAIN:-dominusnode.com}}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_IGNORE_TLS: ${SMTP_IGNORE_TLS:-false}
      APP_URL: ${APP_URL:-https://dominusnode.com}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      ADMIN_HUMAN_LOGIN: ${ADMIN_HUMAN_LOGIN:-false}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      # Contacts/branding for /.well-known/security.txt and coordinator.json.
      OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
      ABUSE_CONTACT: ${ABUSE_CONTACT:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      SITE_NAME: ${SITE_NAME:-}
      OFFICIAL_COORD_PUBKEYS: ${OFFICIAL_COORD_PUBKEYS:-}
      # Signs coordinator.json/policy.json (503 without it); same key as the proxy.
      COORD_SIGNING_KEY_FILE: /run/secrets/coord_signing_key
      # API key pepper (DEPLOYMENT.md §3b); MUST be the same file as the proxy's.
      API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
      MCP_AGENT_SECRET: ${MCP_AGENT_SECRET:-}
      AGENT_RATE_LIMIT_MULTIPLIER: ${AGENT_RATE_LIMIT_MULTIPLIER:-10}
      DOMINUSNODE_DOMAIN: ${DOMINUSNODE_DOMAIN:-dominusnode.com}
      COORDINATOR_HOSTNAMES: ${COORDINATOR_HOSTNAMES:-dominusnode.com,dominusnode.daedalusdevelopmentgroup.com}
      # Canary probe budget on /v1/probe/echo; same value on api and proxy (32+ chars).
      PROBE_AUTH_SECRET: ${PROBE_AUTH_SECRET:-}
      NODE_ENV: production
    secrets:
      - coord_signing_key
      - api_key_pepper
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # API port NOT exposed to host — only reachable via nginx on the frontend network
    # Use 'docker exec' or SSH tunnel for direct API access if needed
    expose:
      - "3000"
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - ./data:/app/data:ro
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  proxy:
    logging: *default-logging
    # Exceeds the gateway shutdown drain (20 s + settlement) so open
    # sessions are settled, not cut off by SIGKILL after the 10 s default.
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: infra/docker/proxy.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*rail-env, *rail-gateway-env]
      DATABASE_URL: postgresql://${POSTGRES_USER:-dominusnode}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dominusnode}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Listener ports (getProxyPorts); the gateway refuses to start if two are equal.
      PROXY_LISTEN_PORT: "8080"     # plaintext HTTP proxy
      SOCKS5_LISTEN_PORT: "1080"    # plaintext SOCKS5
      PROXY_TLS_PORT: "8443"        # HTTPS proxy: clients send credentials over TLS
      SOCKS5_TLS_PORT: "1443"       # SOCKS5 over TLS (same proxy.crt), as in self-host
      TUNNEL_PORT: "9443"           # node tunnel (wss), gateway-terminated TLS
      # Certificates: mount a directory with proxy.{crt,key} and tunnel.{crt,key}
      # (one cert with SANs for proxy. and relay. may be copied to both names).
      PROXY_TLS_CERT_FILE: /app/certs/proxy.crt
      PROXY_TLS_KEY_FILE: /app/certs/proxy.key
      TUNNEL_TLS_CERT_FILE: /app/certs/tunnel.crt
      TUNNEL_TLS_KEY_FILE: /app/certs/tunnel.key
      # Coordinator signing key (npm run gen:coord-key); required in production.
      COORD_SIGNING_KEY_FILE: /run/secrets/coord_signing_key
      API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
      # Offline ip2asn country+ASN DB (scripts/update-asn-db.sh). Missing = all public traffic refused.
      ASN_DB_FILE: /app/data/ip2asn-combined.tsv.gz
      AGENT_RATE_LIMIT_MULTIPLIER: ${AGENT_RATE_LIMIT_MULTIPLIER:-10}
      PROBE_AUTH_SECRET: ${PROBE_AUTH_SECRET:-}
      # Canary + egress verification probes (ABUSE_CONTROLS T6): exit nodes
      # dial this public echo URL so split-tunnel class fraud is caught.
      # PROBES_DISABLED=true is the explicit opt-out and wins over PROBE_URL.
      PROBE_URL: ${PROBE_URL:-https://${DOMINUSNODE_DOMAIN:-dominusnode.com}/v1/probe/echo}
      PROBES_DISABLED: ${PROBES_DISABLED:-}
      # Host-local clients of the 127.0.0.1-published plaintext ports arrive via
      # docker-proxy as the bridge gateway (private) and are refused in
      # production unless that address/range is listed here.
      PROXY_TRUSTED_CLIENT_CIDRS: ${PROXY_TRUSTED_CLIENT_CIDRS:-}
      NODE_ENV: production
    secrets:
      - coord_signing_key
      - api_key_pepper
    volumes:
      - ./data:/app/data:ro
      - ${PROXY_TLS_DIR:-./certs}:/app/certs:ro
    # IMPORTANT: In production, use a firewall (ufw/iptables/security group) to restrict
    # access to proxy ports. The plaintext listeners default to localhost; clients
    # should use the TLS proxy on 8443 (HTTPS) or 1443 (SOCKS5 over TLS). Override with PROXY_HTTP_HOST_PORT etc. in .env.
    ports:
      - "${PROXY_HTTP_HOST_PORT:-127.0.0.1:8080}:8080"
      - "${PROXY_SOCKS5_HOST_PORT:-127.0.0.1:1080}:1080"
      - "${PROXY_TLS_HOST_PORT:-8443}:8443"
      - "${SOCKS5_TLS_HOST_PORT:-1443}:1443"
      - "${TUNNEL_HOST_PORT:-9443}:9443"
    networks:
      - proxy
      - backend  # Needs DB access for auth, balance checks, session recording
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/internal/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  frontend:
    logging: *default-logging
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_HOST_PORT:-127.0.0.1:80}:8080"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

networks:
  frontend:
  backend:
  proxy:

secrets:
  # PEM written by `npm run gen:coord-key` (mode 0600, readable by the container user).
  coord_signing_key:
    file: ${COORD_SIGNING_KEY_PATH:-./secrets/coord-signing-key.pem}
  # API key pepper: `openssl rand -hex 32 > secrets/api-key-pepper` once, then
  # `sudo chown 1001:1001 secrets/api-key-pepper` (mode 0600, readable by the
  # container user uid 1001); never regenerate it (DEPLOYMENT.md §3b). Back it up.
  api_key_pepper:
    file: ${API_KEY_PEPPER_PATH:-./secrets/api-key-pepper}

volumes:
  pgdata:
  backups:
