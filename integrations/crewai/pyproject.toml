[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dominusnode-crewai"
version = "2.0.0"
description = "CrewAI tools for the DominusNode AI-agent relay network (19 v2 tools on the dominusnode SDK)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.80.0",
    "pydantic>=2.0",
    "dominusnode>=2.0.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["dominusnode_crewai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
