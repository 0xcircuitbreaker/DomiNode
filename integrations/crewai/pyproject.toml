[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dominusnode-crewai"
version = "1.2.1"
description = "CrewAI tools for Dominus Node rotating proxy service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "crewai[tools]>=0.28.0",
    "dominusnode>=0.1.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["dominusnode_crewai"]
