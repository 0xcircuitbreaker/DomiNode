[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dominusnode-crewai"
version = "0.1.0"
description = "CrewAI tools for DomiNode rotating proxy service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "crewai[tools]>=0.28.0",
    "dominusnode>=0.1.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = ["pytest"]
