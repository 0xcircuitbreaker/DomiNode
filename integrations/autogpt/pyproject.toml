[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-autogpt"
version = "2.0.0"
description = "AutoGPT plugin for the DominusNode AI-agent relay network (19 v2 commands on the dominusnode SDK)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [

    "dominusnode>=2.0.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_autogpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/DomiNode/tree/master/integrations/autogpt"
Repository = "https://github.com/0xcircuitbreaker/DomiNode"
Issues = "https://github.com/0xcircuitbreaker/DomiNode/issues"
Changelog = "https://github.com/0xcircuitbreaker/DomiNode/blob/master/integrations/autogpt/CHANGELOG.md"
