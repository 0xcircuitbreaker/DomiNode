[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dominusnode-langchain"
version = "2.2.0"
description = "LangChain tools for the DominusNode AI-agent relay network (19 v2 tools on the dominusnode SDK)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "dominusnode>=2.2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["dominusnode_langchain"]

[tool.hatch.build.targets.sdist]
include = ["dominusnode_langchain/", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["**/__pycache__", "**/*.py[cod]"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/DomiNode/tree/master/integrations/langchain"
Repository = "https://github.com/0xcircuitbreaker/DomiNode"
Issues = "https://github.com/0xcircuitbreaker/DomiNode/issues"
Changelog = "https://github.com/0xcircuitbreaker/DomiNode/blob/master/integrations/langchain/CHANGELOG.md"
