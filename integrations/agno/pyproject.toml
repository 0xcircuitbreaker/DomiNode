[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-agno"
version = "1.2.0"
description = "Dominus Node rotating proxy tools for Agno (phidata) agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["httpx>=0.24.0", "agno>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock"]

[tool.setuptools.packages.find]
include = ["dominusnode_agno*"]
