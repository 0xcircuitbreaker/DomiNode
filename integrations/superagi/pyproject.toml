[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-superagi"
version = "2.2.0"
description = "DominusNode toolkit for SuperAGI: the 19 standard relay-network tools, built on the dominusnode SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["dominusnode>=2.2.0,<3", "pydantic>=1.10.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_superagi*"]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/DomiNode/tree/master/integrations/superagi"
Repository = "https://github.com/0xcircuitbreaker/DomiNode"
Issues = "https://github.com/0xcircuitbreaker/DomiNode/issues"
Changelog = "https://github.com/0xcircuitbreaker/DomiNode/blob/master/integrations/superagi/CHANGELOG.md"
