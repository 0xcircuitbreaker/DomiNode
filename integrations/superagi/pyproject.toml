[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-superagi"
version = "1.0.0"
description = "DomiNode toolkit for SuperAGI -- 22 proxy, wallet, and team management tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["httpx>=0.25.0", "pydantic>=1.10.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_superagi*"]
