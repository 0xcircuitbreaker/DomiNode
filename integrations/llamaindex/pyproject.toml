[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dominusnode-llamaindex"
version = "1.0.0"
description = "DomiNode integration for LlamaIndex -- 22 proxy, wallet, and team management tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "llama-index-core>=0.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
include = ["dominusnode_llamaindex*"]
