openapi: 3.1.0
info:
  title: DominusNode relay network (agent API)
  description: |
    DominusNode is a relay network for AI agents: web requests exit through residential,
    datacenter and mobile IPs contributed by node operators, billed per GB from a prepaid
    wallet. Operators earn a share by running the node agent.

    This schema covers the routes a Custom GPT Action can call with a static
    `Authorization: Bearer dn_live_...` API key: the public `/v1` network routes, the
    `/v1` agent routes (node earnings, payouts, session reports) and `/api/x402/info`.
    Fetching pages through the relay, wallet, usage and top-up tools need the proxy
    gateway or a JWT and are served by the `@dominusnode/chatgpt` function handler.
    Never assume prices: call network_pricing.
  version: 2.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.dominusnode.com

security:
  - ApiKeyBearer: []

paths:
  /v1/policy:
    get:
      operationId: network_policy
      summary: Current acceptable-use policy and node floor guarantees
      description: Policy version, sha256, body and the fixed guarantees every node enforces (ports 80/443, blocked targets, no payload logging).
      security: []
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  sha256: { type: string }
                  body: { type: object }
                  floorGuarantees: { type: array, items: { type: string } }
  /v1/pricing:
    get:
      operationId: network_pricing
      summary: Live per-GB prices per IP class and node revenue shares
      description: Prices are in µUSD per GB (1 USD = 1,000,000 µUSD). Always use this instead of assuming prices.
      security: []
      responses:
        "200":
          description: Pricing
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: { type: string }
                  unit: { type: string }
                  prices:
                    type: array
                    items:
                      type: object
                      properties:
                        ipClass: { type: string, enum: [residential, dc, mobile] }
                        pricePerGbMusd: { type: string }
                  nodeShare:
                    type: array
                    items:
                      type: object
                      properties:
                        tier: { type: string }
                        rank: { type: integer }
                        nodeShareBps: { type: integer }
                  maturationHours: { type: integer }
                  rails: { type: array, items: { type: string } }
  /v1/network/stats:
    get:
      operationId: network_stats
      summary: Online relay nodes by IP class and country
      security: []
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  onlineNodes: { type: integer }
                  byClass: { type: object, additionalProperties: { type: integer } }
                  byCountry:
                    type: array
                    items:
                      type: object
                      properties:
                        country: { type: string }
                        online: { type: integer }
                  otherCountries: { type: integer }
                  generatedAt: { type: string }
  /v1/nodes:
    get:
      operationId: node_list
      summary: List the relay nodes you contribute
      description: Status, observed IP, country, class, caps, reputation and last-seen time of your own nodes. Nodes are registered with the node agent (wallet signature), not through this API.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1000000 } }
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: { type: array, items: { type: object } }
                  limit: { type: integer }
                  offset: { type: integer }
  /v1/node/tier:
    get:
      operationId: node_tier
      summary: Your node-operator tier and progress to the next tier
      responses:
        "200":
          description: Tier
          content:
            application/json:
              schema:
                type: object
                properties:
                  tier: { type: object }
                  nextTier: { type: object, nullable: true }
                  progress: { type: object }
  /v1/credits:
    get:
      operationId: credits_balance
      summary: Node earnings (pending, available, frozen credit in µUSD)
      responses:
        "200":
          description: Credits
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending: { $ref: "#/components/schemas/Money" }
                  available: { $ref: "#/components/schemas/Money" }
                  frozen: { $ref: "#/components/schemas/Money" }
                  autoConvertPct: { type: integer }
                  tier: { type: object }
                  payoutsEnabled: { type: boolean }
                  minWithdraw: { $ref: "#/components/schemas/Money" }
  /v1/credits/convert:
    post:
      operationId: credits_convert
      summary: Convert available node credit into prepaid wallet balance
      description: Amount in µUSD (10000 to 10000000000). Reuse the same Idempotency-Key to retry safely.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,120}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMusd]
              properties:
                amountMusd: { type: string, pattern: "^[1-9][0-9]{0,15}$", description: "Whole µUSD as a string, e.g. \"5000000\" for $5" }
      responses:
        "200":
          description: Converted
          content:
            application/json:
              schema:
                type: object
                properties:
                  converted: { $ref: "#/components/schemas/Money" }
                  convertedCents: { type: integer }
                  duplicate: { type: boolean }
  /v1/payouts:
    get:
      operationId: payouts_list
      summary: On-chain payout history for node earnings
      description: Withdrawals themselves need a wallet signature and are not available as an action.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 1000000 } }
      responses:
        "200":
          description: Payouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  payouts: { type: array, items: { type: object } }
                  limit: { type: integer }
                  offset: { type: integer }
  /v1/sessions/{id}/report:
    post:
      operationId: report_session
      summary: Report a relay session whose exit node misbehaved
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [blocked, captcha, rate_limited, slow, bad_content, other] }
      responses:
        "200":
          description: Reported
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportId: { type: string }
                  reportsToday: { type: integer }
                  limitPerDay: { type: integer }
  /api/x402/info:
    get:
      operationId: x402_info
      summary: x402 (HTTP 402 micropayment) support, facilitators and pricing
      security: []
      responses:
        "200":
          description: x402 info
          content:
            application/json:
              schema: { type: object }

components:
  securitySchemes:
    ApiKeyBearer:
      type: http
      scheme: bearer
      description: A personal dn_live_ API key, entered once in the GPT's Action authentication settings.
  schemas:
    Money:
      type: object
      properties:
        musd: { type: string, description: Integer µUSD }
        usd: { type: string, description: USD with 6 decimals }
