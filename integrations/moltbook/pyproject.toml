[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-moltbook"
version = "2.2.0"
description = "DominusNode v2 standard tool set (19 relay-network tools) for agent runtimes, built on the dominusnode SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["dominusnode>=2.2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_moltbook*"]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/DomiNode/tree/master/integrations/moltbook"
Repository = "https://github.com/0xcircuitbreaker/DomiNode"
Issues = "https://github.com/0xcircuitbreaker/DomiNode/issues"
Changelog = "https://github.com/0xcircuitbreaker/DomiNode/blob/master/integrations/moltbook/CHANGELOG.md"
