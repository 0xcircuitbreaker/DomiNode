[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-moltbook"
version = "1.1.0"
description = "Dominus Node integration for Moltbook -- interact with the AI agent social network through rotating proxies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["httpx>=0.25.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_moltbook*"]
