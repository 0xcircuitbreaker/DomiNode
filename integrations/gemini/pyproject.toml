[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-gemini"
version = "2.2.0"
description = "DominusNode v2 function declarations and handler for Google Gemini / Vertex AI, built on the dominusnode SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["dominusnode>=2.2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
genai = ["google-genai>=1.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_gemini*"]

[tool.pytest.ini_options]
testpaths = ["python_tests"]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/DomiNode/tree/master/integrations/gemini"
Repository = "https://github.com/0xcircuitbreaker/DomiNode"
Issues = "https://github.com/0xcircuitbreaker/DomiNode/issues"
Changelog = "https://github.com/0xcircuitbreaker/DomiNode/blob/master/integrations/gemini/CHANGELOG.md"
