[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-gemini"
version = "2.0.0"
description = "DominusNode v2 function declarations and handler for Google Gemini / Vertex AI, built on the dominusnode SDK"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["dominusnode>=2.0.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
genai = ["google-genai>=1.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_gemini*"]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
