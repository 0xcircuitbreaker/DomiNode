[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-camel"
version = "2.0.0"
description = "CAMEL-AI toolkit for the DominusNode AI-agent relay network (19 v2 tools on the dominusnode SDK)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "camel-ai>=0.2.0",
    "mcp<2",  # camel-ai 0.2.x imports mcp.server.FastMCP, removed in mcp 2
    "dominusnode>=2.0.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_camel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
