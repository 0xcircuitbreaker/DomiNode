[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-metagpt"
version = "2.1.0"
description = "DominusNode agent relay network tools for MetaGPT (19 tools, built on the dominusnode SDK)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["dominusnode>=2.1.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
metagpt = ["metagpt>=0.8"]

[tool.setuptools.packages.find]
include = ["dominusnode_metagpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/DomiNode/tree/master/integrations/metagpt"
Repository = "https://github.com/0xcircuitbreaker/DomiNode"
Issues = "https://github.com/0xcircuitbreaker/DomiNode/issues"
Changelog = "https://github.com/0xcircuitbreaker/DomiNode/blob/master/integrations/metagpt/CHANGELOG.md"
