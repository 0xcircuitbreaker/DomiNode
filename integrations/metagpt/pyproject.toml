[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-metagpt"
version = "2.0.0"
description = "DominusNode agent relay network tools for MetaGPT (19 tools, built on the dominusnode SDK)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["dominusnode>=2.0.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
metagpt = ["metagpt>=0.8"]

[tool.setuptools.packages.find]
include = ["dominusnode_metagpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
