name: dominusnode_fetch
enabled: true
required: false
description: Fetch a public URL through the DominusNode relay network (GET or HEAD only, ports 80/443, no redirects
  followed, 10 MB cap, private/internal targets refused). Billed per GB at the live price for the exit IP class
  (see network_pricing). http:// targets need allow_http=true and are visible to the exit node.
parameters:
- name: url
  type: str
  required: true
  description: https:// URL (or http:// with allow_http).
- name: method
  type: str
  required: false
  description: 'HTTP method. One of: GET, HEAD.'
- name: country
  type: str
  required: false
  description: ISO 3166-1 alpha-2 exit country, e.g. US. Sanctioned countries are refused.
- name: ip_class
  type: str
  required: false
  description: 'Exit IP class. Each class has its own per-GB price (see network_pricing). One of: residential, dc,
    mobile.'
- name: session_id
  type: str
  required: false
  description: Sticky session id (1-64 alphanumeric) to keep the same exit IP.
- name: allow_http
  type: bool
  required: false
  description: Opt in to plaintext http:// targets. Plaintext is visible to the exit node; prefer https.
returns:
- name: result
  type: str
  description: 'JSON string with the result, or {"error": ...} (credentials scrubbed).'
configurations:
  base_url: ''
  proxy_host: ''
