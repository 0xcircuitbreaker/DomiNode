name: dominusnode_credits_convert
enabled: true
required: false
description: Explains how to convert node credits into wallet balance. Conversion needs a wallet signature, so it
  runs through the DominusNode MCP server or SDK with a signer key file, not through this tool.
parameters:
- name: amount_musd
  type: str
  required: true
  description: Amount in micro-USD as a digit string (min 10000 = $0.01).
returns:
- name: result
  type: str
  description: 'JSON string with the result, or {"error": ...} (credentials scrubbed).'
configurations:
  base_url: ''
  proxy_host: ''
