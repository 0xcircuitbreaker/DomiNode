[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-taskweaver"
version = "2.2.0"
description = "DominusNode plugins for Microsoft TaskWeaver: the 19 standard relay-network tools, built on the dominusnode SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["dominusnode>=2.2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_taskweaver*"]

[tool.setuptools.package-data]
dominusnode_taskweaver = ["plugins/*.yaml", "plugins/*.py"]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/DomiNode/tree/master/integrations/taskweaver"
Repository = "https://github.com/0xcircuitbreaker/DomiNode"
Issues = "https://github.com/0xcircuitbreaker/DomiNode/issues"
Changelog = "https://github.com/0xcircuitbreaker/DomiNode/blob/master/integrations/taskweaver/CHANGELOG.md"
