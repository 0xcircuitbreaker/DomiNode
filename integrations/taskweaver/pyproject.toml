[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-taskweaver"
version = "2.0.0"
description = "DominusNode plugins for Microsoft TaskWeaver: the 19 standard relay-network tools, built on the dominusnode SDK"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["dominusnode>=2.0.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_taskweaver*"]

[tool.setuptools.package-data]
dominusnode_taskweaver = ["plugins/*.yaml", "plugins/*.py"]
