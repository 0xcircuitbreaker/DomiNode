[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-agent-zero"
version = "2.1.0"
description = "DominusNode tools for Agent Zero: the 19 standard relay-network tools, built on the dominusnode SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["dominusnode>=2.1.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_agent_zero*"]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/DomiNode/tree/master/integrations/agent-zero"
Repository = "https://github.com/0xcircuitbreaker/DomiNode"
Issues = "https://github.com/0xcircuitbreaker/DomiNode/issues"
Changelog = "https://github.com/0xcircuitbreaker/DomiNode/blob/master/integrations/agent-zero/CHANGELOG.md"
