identity:
  author: dominusnode
  name: dominusnode
  label:
    en_US: DominusNode
  description:
    en_US: Agent relay network. Fetch through agent-contributed exit nodes, live pricing,
      prepaid wallet, and earning by contributing an IP.
  icon: icon.svg
  tags:
  - search
  - utilities
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: DominusNode API Key
    placeholder:
      en_US: dn_live_...
    help:
      en_US: Your DominusNode API key (dn_live_ or dn_test_). Stored by Dify as a
        secret, never sent to the model.
  base_url:
    type: text-input
    required: false
    label:
      en_US: API Base URL
    placeholder:
      en_US: https://api.dominusnode.daedalusdevelopmentgroup.com
  proxy_host:
    type: text-input
    required: false
    label:
      en_US: Proxy Host
    placeholder:
      en_US: proxy.dominusnode.daedalusdevelopmentgroup.com
tools:
- tools/fetch.yaml
- tools/proxy_url.yaml
- tools/network_policy.yaml
- tools/network_pricing.yaml
- tools/network_stats.yaml
- tools/balance.yaml
- tools/transactions.yaml
- tools/topup_crypto.yaml
- tools/check_payment.yaml
- tools/usage.yaml
- tools/active_sessions.yaml
- tools/report_session.yaml
- tools/node_list.yaml
- tools/node_tier.yaml
- tools/node_setup_guide.yaml
- tools/credits_balance.yaml
- tools/credits_convert.yaml
- tools/payouts_list.yaml
- tools/x402_info.yaml
extra:
  python:
    source: provider/dominusnode.py
