[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-dify"
version = "2.0.0"
description = "DominusNode agent relay network tools for Dify (19 tools, built on the dominusnode SDK)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["dominusnode>=2.0.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0", "dify_plugin>=0.4.0"]
plugin = ["dify_plugin>=0.4.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_dify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/DomiNode/tree/master/integrations/dify"
Repository = "https://github.com/0xcircuitbreaker/DomiNode"
Issues = "https://github.com/0xcircuitbreaker/DomiNode/issues"
Changelog = "https://github.com/0xcircuitbreaker/DomiNode/blob/master/integrations/dify/CHANGELOG.md"
