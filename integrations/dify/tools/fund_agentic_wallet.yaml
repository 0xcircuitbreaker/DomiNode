identity:
  name: fund_agentic_wallet
  author: DomiNode
  label:
    en_US: Fund Agentic Wallet
description:
  human:
    en_US: Fund an agentic wallet from the main wallet
  llm: Transfer funds from the main wallet to an agentic sub-wallet. The amount is debited from the main wallet and credited to the agentic wallet.
parameters:
  - name: wallet_id
    type: string
    required: true
    label:
      en_US: Wallet ID
    human_description:
      en_US: ID of the agentic wallet to fund
    llm_description: The UUID of the agentic wallet to fund.
  - name: amount_cents
    type: number
    required: true
    label:
      en_US: Amount (cents)
    human_description:
      en_US: Amount to transfer in cents
    llm_description: Amount to transfer in cents. Must be a positive integer (1 to 2,147,483,647).
