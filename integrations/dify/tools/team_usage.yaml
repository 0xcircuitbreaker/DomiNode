identity:
  name: team_usage
  author: Dominus Node
  label:
    en_US: Team Usage
description:
  human:
    en_US: Get usage/transaction history for a team
  llm: Get usage and transaction history for a team's shared wallet. Returns fund, spend, and refund transactions.
parameters:
  - name: team_id
    type: string
    required: true
    label:
      en_US: Team ID
    human_description:
      en_US: UUID of the team
    llm_description: The UUID of the team to get usage for.
  - name: limit
    type: number
    required: false
    default: 20
    label:
      en_US: Limit
    human_description:
      en_US: Maximum number of records to return (1-100)
    llm_description: Maximum number of records to return. Must be between 1 and 100. Default is 20.
