identity:
  name: update_team_member_role
  author: DomiNode
  label:
    en_US: Update Team Member Role
description:
  human:
    en_US: Update the role of a team member
  llm: Change the role of a team member to either 'member' or 'admin'. Requires owner or admin role.
parameters:
  - name: team_id
    type: string
    required: true
    label:
      en_US: Team ID
    human_description:
      en_US: UUID of the team
    llm_description: The UUID of the team.
  - name: user_id
    type: string
    required: true
    label:
      en_US: User ID
    human_description:
      en_US: UUID of the user whose role to change
    llm_description: The UUID of the user whose role to change.
  - name: role
    type: string
    required: true
    label:
      en_US: Role
    human_description:
      en_US: New role (member or admin)
    llm_description: "New role for the team member. Must be either 'member' or 'admin'."
    options:
      - value: member
        label:
          en_US: Member
      - value: admin
        label:
          en_US: Admin
