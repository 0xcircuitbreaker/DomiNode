identity:
  name: check_usage
  author: DomiNode
  label:
    en_US: Check Usage
description:
  human:
    en_US: Check proxy usage statistics
  llm: Check DomiNode proxy usage statistics for a given time period. Returns bandwidth consumed and cost breakdown.
parameters:
  - name: period
    type: string
    required: false
    default: "month"
    label:
      en_US: Time Period
    human_description:
      en_US: Time period for usage stats
    llm_description: "Time period for usage statistics: day (last 24h), week (last 7 days), or month (last 30 days)."
    options:
      - value: day
        label:
          en_US: Last 24 hours
      - value: week
        label:
          en_US: Last 7 days
      - value: month
        label:
          en_US: Last 30 days
