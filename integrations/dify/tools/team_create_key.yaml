identity:
  name: team_create_key
  author: DomiNode
  label:
    en_US: Create Team API Key
description:
  human:
    en_US: Create a new API key for a team
  llm: Create a new API key for a team. The key is shown once upon creation and bills to the team's shared wallet.
parameters:
  - name: team_id
    type: string
    required: true
    label:
      en_US: Team ID
    human_description:
      en_US: UUID of the team
    llm_description: The UUID of the team to create an API key for.
  - name: label
    type: string
    required: true
    label:
      en_US: Key Label
    human_description:
      en_US: Human-readable label for the key (max 100 characters)
    llm_description: Human-readable label for the API key. Max 100 characters, no control characters.
