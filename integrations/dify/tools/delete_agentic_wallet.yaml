identity:
  name: delete_agentic_wallet
  author: Dominus Node
  label:
    en_US: Delete Agentic Wallet
description:
  human:
    en_US: Delete an agentic wallet (must be unfrozen first; refunds balance)
  llm: Delete an agentic sub-wallet. The wallet must be unfrozen (active status) before deletion. Any remaining balance is refunded to the main wallet.
parameters:
  - name: wallet_id
    type: string
    required: true
    label:
      en_US: Wallet ID
    human_description:
      en_US: ID of the agentic wallet to delete
    llm_description: The UUID of the agentic wallet to delete.
