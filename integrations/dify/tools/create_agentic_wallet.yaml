identity:
  name: create_agentic_wallet
  author: Dominus Node
  label:
    en_US: Create Agentic Wallet
description:
  human:
    en_US: Create a new agentic sub-wallet with a spending limit
  llm: Create a new agentic sub-wallet with a per-transaction spending limit. Agentic wallets are custodial sub-wallets funded from the main wallet, designed for AI agent use.
parameters:
  - name: label
    type: string
    required: true
    label:
      en_US: Label
    human_description:
      en_US: Human-readable label for the wallet (max 100 characters)
    llm_description: Human-readable label for the wallet. Max 100 characters, no control characters.
  - name: spending_limit_cents
    type: number
    required: true
    label:
      en_US: Spending Limit (cents)
    human_description:
      en_US: Per-transaction spending limit in cents
    llm_description: Per-transaction spending limit in cents. Must be a positive integer (1 to 2,147,483,647).
  - name: daily_limit_cents
    type: number
    required: false
    label:
      en_US: Daily Limit (cents)
    human_description:
      en_US: Optional daily budget cap in cents (1 to 1,000,000)
    llm_description: Optional daily budget cap in cents. Must be a positive integer between 1 and 1,000,000.
  - name: allowed_domains
    type: string
    required: false
    label:
      en_US: Allowed Domains (JSON array)
    human_description:
      en_US: JSON array of domain strings to restrict proxy usage (max 100 entries)
    llm_description: Optional JSON-encoded array of domain strings to restrict proxy usage. Max 100 entries, each <= 253 chars, valid domain format.
