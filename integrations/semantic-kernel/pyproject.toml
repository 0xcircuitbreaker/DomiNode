[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-semantic-kernel"
version = "2.1.0"
description = "DominusNode agent relay network tools for Semantic Kernel (19 tools, built on the dominusnode SDK)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["dominusnode>=2.1.0,<3", "semantic-kernel>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_semantic_kernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/DomiNode/tree/master/integrations/semantic-kernel"
Repository = "https://github.com/0xcircuitbreaker/DomiNode"
Issues = "https://github.com/0xcircuitbreaker/DomiNode/issues"
Changelog = "https://github.com/0xcircuitbreaker/DomiNode/blob/master/integrations/semantic-kernel/CHANGELOG.md"
