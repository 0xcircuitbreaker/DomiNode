[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-haystack"
version = "2.0.0"
description = "DominusNode agent relay network tools for Haystack (19 tools, built on the dominusnode SDK)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["dominusnode>=2.0.0,<3", "haystack-ai>=2.10"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_haystack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
