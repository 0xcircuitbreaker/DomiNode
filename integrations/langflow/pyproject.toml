[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-langflow"
version = "2.0.0"
description = "DominusNode agent relay network tools for Langflow (19 tools, built on the dominusnode SDK)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["dominusnode>=2.0.0,<3", "langchain-core>=0.3"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
langflow = ["langflow>=1.0"]

[tool.setuptools.packages.find]
include = ["dominusnode_langflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/0xcircuitbreaker/DomiNode/tree/master/integrations/langflow"
Repository = "https://github.com/0xcircuitbreaker/DomiNode"
Issues = "https://github.com/0xcircuitbreaker/DomiNode/issues"
Changelog = "https://github.com/0xcircuitbreaker/DomiNode/blob/master/integrations/langflow/CHANGELOG.md"
