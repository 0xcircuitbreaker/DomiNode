[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dominusnode-pydanticai"
version = "1.0.1"
description = "Dominus Node rotating proxy tools for PydanticAI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["httpx>=0.24.0", "pydantic>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock"]

[tool.setuptools.packages.find]
include = ["dominusnode_pydanticai*"]
