[package]
name = "dominusnode"
version = "1.0.0"
edition = "2021"
description = "Official Dominus Node SDK for Rust"
license = "MIT"
repository = "https://github.com/Dominus-Node/dominusnode-rust"
homepage = "https://dominusnode.com"
readme = "README.md"
keywords = ["proxy", "api", "sdk", "dominusnode"]
categories = ["api-bindings", "web-programming"]
exclude = ["target/", ".git/", "tests/"]

[features]
default = ["async"]
async = ["tokio"]
blocking = []

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"], optional = true }
base64 = "0.22"
tracing = "0.1"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
