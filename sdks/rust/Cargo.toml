[package]
name = "dominusnode"
version = "2.0.1"
edition = "2021"
description = "Official Dominus Node relay-network SDK for Rust"
license = "MIT"
repository = "https://github.com/0xcircuitbreaker/DomiNode"
homepage = "https://dominusnode.daedalusdevelopmentgroup.com"
readme = "README.md"
keywords = ["proxy", "api", "sdk", "dominusnode"]
categories = ["api-bindings", "web-programming"]
exclude = ["target/", ".git/", "tests/"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
