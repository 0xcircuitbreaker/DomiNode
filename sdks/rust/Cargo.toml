[package]
name = "dominode"
version = "1.0.0"
edition = "2021"
description = "Official DomiNode SDK for Rust"
license = "MIT"
repository = "https://github.com/dominode/dominode-sdk-rust"
keywords = ["proxy", "api", "sdk", "dominode"]
categories = ["api-bindings", "web-programming"]

[features]
default = ["async"]
async = ["tokio"]
blocking = []

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"], optional = true }
base64 = "0.22"
tracing = "0.1"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
