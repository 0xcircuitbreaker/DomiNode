version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dominode
      POSTGRES_USER: dominode
      POSTGRES_PASSWORD: dominode_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/shared/src/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  pgdata:
